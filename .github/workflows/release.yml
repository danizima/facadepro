name: Verify Facadepro release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install PDF and browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-reportlab python3-pil poppler-utils libnss3 libatk-bridge2.0-0 libxkbcommon0 libgbm1 libasound2t64 fonts-dejavu-core
      - name: Check syntax and build pages
        run: |
          npm run check
          npm run build
          python3 -m py_compile deploy/*.py
      - name: Test server and update controller
        run: npm test
      - name: Build production image
        run: docker build -t facadepro-ci:${{ github.sha }} .
      - name: Check production container startup
        run: |
          docker run --detach --name facadepro-ci-smoke --publish 127.0.0.1:18080:8080 --env PUBLIC_URL=https://facadepro.test --env SMTP_HOST= --env SMTP_FROM= --env TELEGRAM_BOT_TOKEN= --env TELEGRAM_CHAT_ID= facadepro-ci:${{ github.sha }}
          trap 'docker logs facadepro-ci-smoke; docker rm --force --volumes facadepro-ci-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/healthz > "$RUNNER_TEMP/facadepro-container-health.json"; then
              node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const health=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/facadepro-container-health.json")); const pkg=JSON.parse(fs.readFileSync("package.json")); assert.deepEqual(health,{ok:true,version:pkg.version});'
              curl --fail --silent --max-time 10 http://127.0.0.1:18080/ > "$RUNNER_TEMP/facadepro-container-home.html"
              node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const home=fs.readFileSync(process.env.RUNNER_TEMP+"/facadepro-container-home.html","utf8"); assert.ok(home.includes("visual21-hero")); assert.ok(home.includes("brand-note"));'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Install pinned browser test tools
        run: npm install --prefix "$RUNNER_TEMP/facade-browser" playwright@1.62.1 @sparticuz/chromium@153.0.0 --no-audit --no-fund
      - name: Check desktop and mobile flows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/facade-browser/node_modules/playwright
          CHROMIUM_MODULE: ${{ runner.temp }}/facade-browser/node_modules/@sparticuz/chromium
          BROWSER_BIN_DIR: ${{ runner.temp }}/facade-chromium
          CHROMIUM_EXECUTABLE_PATH: ${{ runner.temp }}/facade-chromium/chromium
        run: |
          node scripts/prepare-browser.mjs
          node tests/browser.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.sha }}
          path: artifacts/browser
          if-no-files-found: ignore
          retention-days: 7
